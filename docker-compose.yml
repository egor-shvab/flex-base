services:
  postgres:
    image: postgres:17-alpine
    container_name: flexbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flexbase
      POSTGRES_PASSWORD: flexbase
      POSTGRES_DB: flexbase
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flexbase -d flexbase']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
