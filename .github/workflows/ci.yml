name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest

    env:
      # Nothing here connects to a database — `prisma generate` only needs the
      # datasource variable to resolve, and the build never boots the server.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate && nuxt prepare`, which the checks below need
      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      # Unit tests only — pure logic, so this needs no database service, just the
      # generated Prisma client `postinstall` already produced
      - run: npm run test

      - run: npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    # A throwaway database per run. Named `*_test` deliberately: the suite truncates every
    # table between cases and refuses to start against a database not named that way.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flexbase
          POSTGRES_PASSWORD: flexbase
          POSTGRES_DB: flexbase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flexbase -d flexbase_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # `DATABASE_URL` is what `postinstall`'s `prisma generate` resolves; the suite itself
      # reads `INTEGRATION_DATABASE_URL`, which is the only name that overrides its default.
      DATABASE_URL: postgresql://flexbase:flexbase@localhost:5432/flexbase_test
      INTEGRATION_DATABASE_URL: postgresql://flexbase:flexbase@localhost:5432/flexbase_test
      JWT_SECRET: ci-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Applies the migrations itself, against the service container above
      - run: npm run test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flexbase
          POSTGRES_PASSWORD: flexbase
          POSTGRES_DB: flexbase_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flexbase -d flexbase_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # `DATABASE_URL` is for `postinstall`'s `prisma generate`; the suite reads
      # `E2E_DATABASE_URL`, which is the only name that overrides its default.
      DATABASE_URL: postgresql://flexbase:flexbase@localhost:5432/flexbase_e2e
      E2E_DATABASE_URL: postgresql://flexbase:flexbase@localhost:5432/flexbase_e2e
      JWT_SECRET: ci-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium only — the suite is about this app's behaviour, not about browser differences
      - name: Cache the browser download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # Builds the app and starts it itself, per `playwright.config.ts`
      - run: npm run test:e2e

      # A failure nobody can inspect is a flake by default
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
